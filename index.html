<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantitative Reasoning Presentation | NUTECH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f4f8, #f8fafc, #ffffff);
            color: #1e293b;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            max-width: 600px;
            width: 90%;
        }
        .badge {
            background: rgba(14, 165, 233, 0.1);
            color: #0284c7;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(14, 165, 233, 0.2);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(2, 132, 199, 0.4);
            background: #0369a1;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">NUTECH University</div>
        <h1>Quantitative Reasoning Presentation</h1>
        <p>Welcome! Click the button below to instantly access and present the slide files directly from Google Drive without signing in.</p>
        
        <a href="https://drive.google.com/drive/folders/1MPJuaJRdEc_U2gm080yLrOC2Ixpjcl0I?usp=sharing" target="_blank" class="btn">
            Access Presentation Slides 🚀
        </a>

        <div class="footer">
            Secured & Hosted for Seamless Presentation Access
        </div>
    </div>

</body>
</html>
